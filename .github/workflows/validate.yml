name: validate sources

# The source list is the part of this project that rots. Company tokens get
# renamed, boards migrate between ATSs, companies get acquired. Without this
# the list looks maintained while quietly going stale.
#
# Runs weekly, checks every bundled source is alive and is still the company it
# claims to be, and opens a pull request when something has changed. Nothing is
# removed without a human merging it. A week with nothing to remove commits the
# checked date and the emptiness log straight to main, since it deletes nothing.
#
# This is the only unattended job here that deletes anything, so read the
# guards below before changing them. There are four, and they are in different
# places on purpose:
#
#  1. `count_jobs` returns a reason as well as a count, so a failed fetch is
#     never counted as an empty board.
#  2. A TLS handshake failure sets a `transport` flag and forces the verdict to
#     "unreachable". A handshake that never completed is a fact about the
#     machine running `validate`, not about the employer, and it is never
#     evidence a board is dead however many Sundays in a row it reports.
#  3. `validate --prune` refuses outright when more than a quarter of the list
#     comes back empty, which is what a platform outage or a rate-limited
#     runner looks like.
#  4. The step below re-checks every row about to be deleted, and blocks the
#     pull request rather than the prune. The prune only rewrites a file on the
#     runner; nothing is destroyed until that file is committed, so the pull
#     request is the last point where this can still be stopped.

on:
  schedule:
    - cron: "0 4 * * 0"   # Sundays, 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # For the failure report at the end. A weekly job that nobody watches needs
  # somewhere to put "this did not work" that is not the Actions tab.
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    # 17,810 entries, paced per host. apply.workable.com holds 2,094 of them at
    # 0.7 requests a second, which is a 50 minute floor on that host alone
    # before the 4,078 Greenhouse boards are counted. The last scheduled run
    # took 1m45s against a 653 entry list, so nothing about the old runtime
    # says anything about this one. The step limit is below the job limit so
    # that the failure report at the end still gets to run.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e .

      - name: Check every source
        timeout-minutes: 300
        # No --force-prune. That flag exists to override the "more than a
        # quarter of the list came back empty" refusal, which is the one thing
        # standing between a rate-limited runner and a pull request that
        # deletes several thousand live employers. It has no business in an
        # unattended job.
        run: |
          job-radar validate --file sources/sources.json \
                             --report out/validation.json \
                             --prune

      - name: Summarise
        id: sum
        run: |
          python3 - <<'PY'
          import json, os

          r = json.load(open("out/validation.json", encoding="utf-8"))
          rows = r.get("rows") or []
          # `dead` in the report is every board that answered with nothing
          # open today. What is about to be DELETED is `pruned`: a board has
          # to stay empty for weeks first (jobradar/deadwood.py), so the two
          # differ, by hundreds on the first runs after that rule landed.
          # Everything below that decides whether to delete keys on `pruned`.
          empty = r.get("dead") or []
          pruned = r.get("pruned")
          # A report without the field came from a validate that predates it.
          # "Cannot say what it would delete" must never read as "deletes
          # nothing", so that refuses.
          no_claim = pruned is None
          dead = pruned or []
          mismatch = r.get("mismatch") or []
          unreachable = [x for x in rows if x.get("verdict") == "unreachable"]
          transport = [x for x in rows if x.get("transport")]

          # Every row that is about to be deleted, checked again here rather
          # than trusted. `--prune` keys on the verdict; this keys on the
          # per-row `prunable` flag and on the transport alert, so a future
          # refactor that lets a handshake failure reach the "dead" branch is
          # caught by a different piece of code than the one that broke.
          unsafe = [d for d in dead
                    if d.get("transport")
                    or d.get("verdict") != "dead"
                    or d.get("prunable") is False]

          # An absolute cap, because the refusal inside `validate` is a share.
          # A quarter of 653 sources was 163; a quarter of 17,810 is 4,452, so
          # the same rule that was tight on the old list would now wave through
          # a pull request deleting four thousand employers. Weekly attrition
          # on a list this size is tens, not hundreds.
          CAP = 250
          refuse = no_claim or bool(unsafe) or len(dead) > CAP

          out = []
          out.append("## Source validation\n")
          out.append(f"- checked: **{r['total']}**")
          out.append(f"- empty today (answered, no postings): **{len(empty)}**")
          out.append(f"- empty, not yet for long enough to delete: **{r.get('waiting', 0)}**")
          out.append(f"- to be removed: **{len(dead)}**")
          # Never shown before, which meant a run where nine thousand boards
          # could not be read looked exactly like a clean one.
          out.append(f"- unreachable (left alone): **{len(unreachable)}**")
          out.append(f"- TLS handshake failures (never prunable): **{len(transport)}**")
          out.append(f"- identity mismatch: **{len(mismatch)}**\n")
          if no_claim:
              out.append("### Refusing to commit anything\n")
              out.append("The report does not say which boards the prune removed, "
                         "so there is no claim to check the diff against.\n")
          elif unsafe:
              out.append("### Refusing to open a pull request\n")
              out.append(f"{len(unsafe)} row(s) queued for deletion are not safe "
                         "to delete. A board that could not be reached is not a "
                         "board that is gone.\n")
              for d in unsafe[:40]:
                  out.append(f"- `{d['company']}`, verdict `{d.get('verdict')}`, "
                             f"transport `{d.get('transport')}`")
              out.append("")
          elif len(dead) > CAP:
              out.append("### Refusing to open a pull request\n")
              out.append(f"{len(dead)} to remove of {r['total']} is above the cap of "
                         f"{CAP}. That many boards do not die in a week: this is "
                         "a platform change or a throttled runner. Nothing was "
                         "committed. Re-run it, or run it from a laptop.\n")
          if dead:
              out.append("### To be removed\n")
              for d in dead[:60]:
                  out.append(f"- `{d['company']}`, {d['url']}")
          if mismatch:
              out.append("\n### Wrong company?\n")
              out.append("These boards respond, but do not look like who we think they are.")
              out.append("That is how a Florida schools operator ended up filed as a London")
              out.append("payments company.\n")
              for d in mismatch[:60]:
                  out.append(f"- `{d['company']}`, {d['note']}")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(out) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"dead={len(dead)}\n")
              f.write(f"unreachable={len(unreachable)}\n")
              f.write(f"refuse={'true' if refuse else 'false'}\n")
          PY

      - name: The diff has to match the claim
        # A pull request titled "Prune 2 dead source(s)" whose diff removed
        # 17,171 of 17,810 sat open for three days. The branch had been cut
        # before the harvest that grew the list, so its copy of sources.json
        # was a wholesale revert wearing a prune's title, and every guard
        # upstream of here passed: two boards really were dead, two is well
        # under the cap, and the refusal threshold is a share of the run's own
        # source count.
        #
        # None of those look at the artefact. This does. It compares the file
        # about to be committed against the base branch and demands the net
        # removal be exactly the number the title claims, which catches a
        # stale branch, a bad merge, a truncated write, and anything else that
        # makes the diff disagree with the sentence describing it.
        #
        # It runs on a clean week too, where the claim is zero, because a
        # clean week now commits as well (next step) and "removes nothing"
        # is a claim like any other.
        if: steps.sum.outputs.refuse != 'true'
        run: |
          git show "origin/$BASE_BRANCH:sources/sources.json" > /tmp/base.json
          python3 - <<'EOF'
          import json, os, sys
          base = json.load(open("/tmp/base.json", encoding="utf-8"))["sources"]
          head = json.load(open("sources/sources.json", encoding="utf-8"))["sources"]
          bk = {s["url"] for s in base}
          hk = {s["url"] for s in head}
          removed, added = len(bk - hk), len(hk - bk)
          claimed = int(os.environ["DEAD"])
          print(f"base {len(base)}, head {len(head)}, removed {removed}, added {added}, claimed {claimed}")
          if removed != claimed or added:
              print(f"::error::the diff does not match the claim: it removes "
                    f"{removed} and adds {added} while the title says {claimed}. "
                    f"Refusing to open a pull request.")
              sys.exit(1)
          EOF
        env:
          # Through the environment, never interpolated into the script. A
          # `${{ }}` inside a run block is substituted before the shell sees
          # it, so the value becomes code; the repo's own test refuses it and
          # caught this line.
          DEAD: ${{ steps.sum.outputs.dead }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}

      - name: Record a clean check
        # A week with nothing to delete still has to land upstream. This step
        # did not exist: the job committed only when it pruned, so a clean run
        # changed nothing, `meta.checked` stayed where it was, and every
        # dashboard reported the list as unchecked since 25 August while it
        # was being checked. With the rule that a board must stay empty for
        # weeks, nothing to delete is the NORMAL week, and it is exactly the
        # week whose emptiness log has to be kept. Dropped, no board ever
        # reaches the thresholds and the prune never happens.
        #
        # Straight to the default branch rather than a pull request, because
        # nothing is removed, and the step above has just proved it: the net
        # removal had to equal the claim, and the claim is zero.
        if: steps.sum.outputs.dead == '0' && steps.sum.outputs.refuse != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources/sources.json sources/empty-since.json
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "sources: checked $(date -u +%Y-%m-%d), nothing to prune"
          # `pushed` records whether any attempt worked, so three rejected
          # pushes cannot exit with the status of `sleep`.
          pushed=
          for i in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then pushed=yes; break; fi
            echo "push rejected, rebasing (attempt $i)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || exit 1
            sleep 3
          done
          if [ -z "$pushed" ]; then
            echo "::error::the check was committed on the runner but could not be pushed after 3 attempts, so the source list still reads as unchecked."
            exit 1
          fi

      - name: Open a pull request
        if: steps.sum.outputs.dead != '0' && steps.sum.outputs.refuse != 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/validate-sources
          # add-paths, so that a run which happened to leave anything else in
          # the working tree cannot smuggle it into the commit. out/ holds the
          # full report and is gitignored, but an ignore rule is not a reason
          # to widen this.
          # The emptiness log travels with the prune it justifies. Without
          # it committed, a fresh runner starts with no history every Sunday,
          # no board ever reaches the thresholds, and nothing is ever pruned:
          # a guard that never lets anything through is a broken prune, just
          # quieter. Committed, the evidence is in the diff, and a reviewer
          # can see "empty since 4 August" rather than taking this on trust.
          add-paths: |
            sources/sources.json
            sources/empty-since.json
          title: "Prune ${{ steps.sum.outputs.dead }} dead source(s)"
          body: |
            Weekly source validation. Every bundled board was fetched and
            checked for live postings and for company identity.

            Dead sources have been removed from `sources/sources.json`. A
            source is only dead if the board answered and had no postings.
            ${{ steps.sum.outputs.unreachable }} source(s) could not be read at
            all this week and were left exactly where they are: a timeout, a
            429 or a TLS handshake failure is a fact about the runner, not
            about the employer.

            Identity mismatches are listed in the run summary but left in
            place, because a mismatch needs a human to decide whether the
            token is wrong or the company simply renamed itself.

            Full report is in the workflow summary.
          commit-message: "sources: prune dead boards"
          delete-branch: true

      - name: Refuse the prune
        # Deliberately after the pull request step, and deliberately fails the
        # job. The prune has already rewritten the file on this runner, but
        # nothing was committed and the runner is thrown away, so the source
        # list upstream is untouched.
        if: steps.sum.outputs.refuse == 'true'
        run: |
          echo "::error::Refusing to open a prune pull request: ${{ steps.sum.outputs.dead }} dead source(s), and rows that are not safe to delete. See the run summary. Nothing was committed."
          exit 1

      - name: Report a failed run
        # Weekly, unattended, and it deletes things. A red tick on a page
        # nobody opens is not a report.
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # One open notice, not one per failed run. A job that fails every
          # night for a week is one problem, and seven identical issues make
          # it look like seven. `|| true` throughout: a fork with Issues
          # disabled must not fail the job over its own notifications.
          gh issue list --state open --search 'in:title "Source validation failed:"' \
            --json number --jq '.[].number' 2>/dev/null | while read -r n; do
              [ -n "$n" ] && gh issue close "$n" \
                --comment "Superseded by a later run." >/dev/null 2>&1 || true
          done || true
          gh issue create \
            --title "Source validation failed: run ${{ github.run_id }}" \
            --body "The weekly source validation did not finish, or refused to open its pull request. No sources were removed.

          Log: ${RUN_URL}

          The usual causes:

          1. It refused to prune. Either more than 250 boards were due for deletion, or a row queued for deletion had a transport failure against it. Both mean a throttled runner or a platform change, not that many employers died in a week.
          2. It ran past its 300 minute step limit. The list is 17,810 entries and apply.workable.com alone is a 50 minute floor.

          The source list is unchanged either way. This issue is filed once per failed run and is safe to close." \
            || echo "could not file an issue"
